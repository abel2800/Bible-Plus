name: BiblePulse Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build split APKs
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
          YOUVERSION_OFFLINE_VERSION_IDS_JSON: ${{ secrets.YOUVERSION_OFFLINE_VERSION_IDS_JSON }}
          YOUVERSION_BULK_DOWNLOAD_LICENSED: ${{ secrets.YOUVERSION_BULK_DOWNLOAD_LICENSED }}
        run: |
          flutter build apk --release --split-per-abi --dart-define=YOUVERSION_APP_KEY="$YOUVERSION_APP_KEY" --dart-define=YOUVERSION_OFFLINE_VERSION_IDS_JSON="$YOUVERSION_OFFLINE_VERSION_IDS_JSON" --dart-define=YOUVERSION_BULK_DOWNLOAD_LICENSED="${YOUVERSION_BULK_DOWNLOAD_LICENSED:-false}"

      - name: Build App Bundle
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
          YOUVERSION_OFFLINE_VERSION_IDS_JSON: ${{ secrets.YOUVERSION_OFFLINE_VERSION_IDS_JSON }}
          YOUVERSION_BULK_DOWNLOAD_LICENSED: ${{ secrets.YOUVERSION_BULK_DOWNLOAD_LICENSED }}
        run: |
          flutter build appbundle --release --dart-define=YOUVERSION_APP_KEY="$YOUVERSION_APP_KEY" --dart-define=YOUVERSION_OFFLINE_VERSION_IDS_JSON="$YOUVERSION_OFFLINE_VERSION_IDS_JSON" --dart-define=YOUVERSION_BULK_DOWNLOAD_LICENSED="${YOUVERSION_BULK_DOWNLOAD_LICENSED:-false}"

      - name: Prepare release assets
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/biblepulse-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/biblepulse-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            build/app/outputs/flutter-apk/biblepulse-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/bundle/release/biblepulse-${GITHUB_REF_NAME}.aab

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/biblepulse-arm64-v8a.apk
            build/app/outputs/flutter-apk/biblepulse-armeabi-v7a.apk
            build/app/outputs/flutter-apk/biblepulse-x86_64.apk
            build/app/outputs/bundle/release/biblepulse-${{ github.ref_name }}.aab